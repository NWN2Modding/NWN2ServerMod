# How much detail the profiler reports.
# none      - nothing is hooked or timed
# stats     - the periodic per-script table
# callstack - the table, plus a line for every script call as it happens
# 'callstack' is for finding what one event runs, not for leaving on.
#
# default: stats
report_detail: stats

# Time resumed script parts as separate calls.
# A part is the continuation of a script that gave up control, such as
# DelayCommand or anything that went through the action queue.
# default: true
scriptparts: true

# How often statistics are written, in seconds.
# default: 10
flush_seconds: 10

# Log verbosity
# Messages from higher levels are always written. E.g. setting to 'info' will
# also write 'error' and 'warning' messages.
# Possible values: none, error, warning, info, debug, trace
#
# default: info
log_level: info

# Log file maximum size, before it is automatically rotated
# Numbers can end with G M K for gigabytes, megabytes or kilobytes
# 0 disables the log rotation
#
# default: 10M
log_max_file_size: 10M
