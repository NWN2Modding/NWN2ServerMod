# The function class that is provided by this plugin
class: PICK

# The script to execute when someone attempts a pickpocket. OBJECT_SELF will be
# the pickpocketter, and the target can be retrieved with PickpocketGetTarget()
# from the nwnx_pickpocket include. PickpocketCancel() will disallow the action
# once the server returns.
# Nothing is hooked until this is set.
# Example: script: ne_mod_onpickpocket
script: <changeme>

# Log verbosity
# Messages from higher levels are always written. E.g. setting to 'info' will
# also write 'error' and 'warning' messages.
# Possible values: none, error, warning, info, debug, trace
#
# default: info
log_level: info

# Log file maximum size, before it is automatically rotated
# Numbers can end with G M K for gigabytes, megabytes or kilobytes
# 0 disables the log rotation
#
# default: 10M
log_max_file_size: 10M
